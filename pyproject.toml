[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "att-gpt"
version = "0.1.0"
description = "A compact GPT implementation for learning transformer internals on Shakespeare data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AttoGPT Contributors" }]
dependencies = [
  "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
